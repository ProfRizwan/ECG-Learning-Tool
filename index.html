// ===================================
// APP LOGIC
// ===================================

let currentQuestion = 0;
let score = 0;
let answered = false;

const clinicalStem = document.getElementById("clinicalStem");
const ecgImage = document.getElementById("ecgImage");
const optionsContainer = document.getElementById("optionsContainer");
const explanationBox = document.getElementById("explanationBox");
const explanationText = document.getElementById("explanationText");
const scoreElement = document.getElementById("score");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

    answered = false;

    explanationBox.style.display = "none";

    const q = questions[currentQuestion];

    clinicalStem.innerText = q.clinicalStem;

    ecgImage.src = q.image;

    optionsContainer.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn = document.createElement("div");

        btn.classList.add("option");

        btn.innerText = option;

        btn.onclick = ()=>selectAnswer(btn,index);

        optionsContainer.appendChild(btn);
    });

    updateProgress();
}

function selectAnswer(button,index){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const options = document.querySelectorAll(".option");

    options.forEach(opt=>opt.classList.add("disabled"));

    if(index === q.answer){

        button.classList.add("correct");

        score++;

        scoreElement.innerText = score;

    }else{

        button.classList.add("wrong");

        options[q.answer].classList.add("correct");
    }

    explanationText.innerText = q.explanation;

    explanationBox.style.display = "block";
}

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        document.getElementById("quizContainer").style.display = "none";

        document.getElementById("resultScreen").style.display = "block";

        document.getElementById("finalScore").innerText =
        score + " / " + questions.length;

        return;
    }

    loadQuestion();
}

function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    scoreElement.innerText = 0;

    document.getElementById("quizContainer").style.display = "grid";

    document.getElementById("resultScreen").style.display = "none";

    loadQuestion();
}

function updateProgress(){

    const progress =
    ((currentQuestion)/questions.length)*100;

    progressBar.style.width = progress + "%";
}

loadQuestion();
