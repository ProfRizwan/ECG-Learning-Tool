</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="title">ECG Learning Hub</div>
        <div class="score-box">
            Score: <span id="score">0</span>
        </div>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</header>

<div class="container" id="quizContainer">

    <div class="card">
        <div class="section-title">Clinical Scenario</div>

        <div class="clinical-text" id="clinicalStem"></div>

        <img id="ecgImage"
             class="ecg-image"
             src=""
             alt="ECG">
    </div>

    <div class="card">

        <div class="section-title">
            What is the diagnosis?
        </div>

        <div id="optionsContainer"></div>

        <div class="explanation" id="explanationBox">
            <h3 style="margin-bottom:10px;">Teaching Point</h3>

            <div id="explanationText"></div>

            <button class="next-btn" onclick="nextQuestion()">
                Next Question
            </button>
        </div>

    </div>

</div>

<div class="result-screen card" id="resultScreen">

    <h1>Quiz Completed</h1>

    <div class="result-score">
        <span id="finalScore"></span>
    </div>

    <p style="font-size:20px; margin-bottom:20px;">
        Great job revising ECG interpretation.
    </p>

    <button class="next-btn" onclick="restartQuiz()">
        Restart Quiz
    </button>

</div>

<script>

const questions = [

clinicalStem:

options:[

],

},

{

options:[
"VT",
"Asystole",

"SVT"
],

answer:2,

explanation:
"VF is characterized by chaotic electrical activity without organized QRS complexes."
},

{
clinicalStem:
"A post-MI patient presents with broad complex tachycardia and hypotension.",

options:[
"SVT",

"Sinus Tachycardia"
],

answer:1,

explanation:
"Wide complex tachycardia in ischemic heart disease is VT until proven otherwise."
},

{
clinicalStem:
"A patient has diffuse ST elevation with PR depression and pleuritic chest pain.",

"https://litfl.com/wp-content/uploads/2018/08/Pericarditis-ECG-2.jpg",

options:[
"Anterior STEMI",

"LVH"
],

answer:1,

explanation:
"Pericarditis classically causes diffuse concave ST elevation and PR depression."
},

{

image:
"https://litfl.com/wp-content/uploads/2018/08/Hyperkalaemia-ECG-2.jpg",

options:[
"Hypokalemia",
"Hyperkalemia",
"Pericarditis",
"LVH"
],

answer:1,

explanation:
"Hyperkalemia causes peaked T waves and progressive QRS widening."
},

{
clinicalStem:
"A patient on diuretics develops weakness. ECG shows U waves and flattened T waves.",

image:
"https://litfl.com/wp-content/uploads/2018/08/Hypokalaemia-ECG-2.jpg",

options:[
"Hyperkalemia",
"Hypokalemia",
"AF",
"VT"
],

answer:1,

explanation:
"Hypokalemia causes flattened T waves and prominent U waves."
},

{

"A patient presents with crushing chest pain. ECG shows ST elevation in II, III and aVF.",

"https://litfl.com/wp-content/uploads/2018/08/Inferior-STEMI.jpg",

options:[
"Anterior STEMI",
"Inferior STEMI",
"Pericarditis",
"Posterior MI"
],

answer:1,

explanation:
"Inferior STEMI produces ST elevation in II, III and aVF."
},

{
clinicalStem:
"ECG shows ST elevation in V1-V4 with reciprocal inferior changes.",

image:
"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/12_lead_ECG_of_anterior_STEMI.svg/1024px-12_lead_ECG_of_anterior_STEMI.svg.png",

options:[
"Posterior MI",

],

],

},

],

answer:2,

,

answer:2,

"Complete heart block shows AV dissociation with independent atrial and ventricular activity."
},

],

answer:0,

},

image:

options:[

],

answer:1,

explanation:

},

"A hypertensive patient has tall R waves in V5 and V6 with deep S waves in V1.",

options:[
"RVH",

"Hyperkalemia"
],

answer:1,

explanation:
"LVH produces high-voltage QRS complexes especially in left precordial leads."
},

{
clinicalStem:
"A COPD patient has right axis deviation and dominant R waves in V1.",

image:
"https://litfl.com/wp-content/uploads/2018/08/RVH-ECG.jpg",

options:[
"RVH",
"LVH",
"Posterior MI",
"RBBB"
],

answer:0,

explanation:
"RVH causes right axis deviation and tall R waves in V1."
},

options:[

],

answer:1,

},

{

options:[
"Complete Heart Block",
"Sinus Bradycardia",

],

answer:1,

explanation:
"Sinus bradycardia is a sinus rhythm with heart rate below 60 bpm."
},

{

}

// ===================================
// APP LOGIC
// ===================================

let currentQuestion = 0;
let score = 0;
let answered = false;

const clinicalStem = document.getElementById("clinicalStem");
const ecgImage = document.getElementById("ecgImage");
const optionsContainer = document.getElementById("optionsContainer");
const explanationBox = document.getElementById("explanationBox");
const explanationText = document.getElementById("explanationText");
const scoreElement = document.getElementById("score");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

    answered = false;

    explanationBox.style.display = "none";

    const q = questions[currentQuestion];

    clinicalStem.innerText = q.clinicalStem;

    ecgImage.src = q.image;

    optionsContainer.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn = document.createElement("div");

        btn.classList.add("option");

        btn.innerText = option;

        btn.onclick = ()=>selectAnswer(btn,index);

        optionsContainer.appendChild(btn);
    });

    updateProgress();
}

function selectAnswer(button,index){

    if(answered) return;

    answered = true;

    const q = questions[currentQuestion];

    const options = document.querySelectorAll(".option");

    options.forEach(opt=>opt.classList.add("disabled"));

    if(index === q.answer){

        button.classList.add("correct");

        score++;

        scoreElement.innerText = score;

    }else{

        button.classList.add("wrong");

        options[q.answer].classList.add("correct");
    }

    explanationText.innerText = q.explanation;

    explanationBox.style.display = "block";
}

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        document.getElementById("quizContainer").style.display = "none";

        document.getElementById("resultScreen").style.display = "block";

        document.getElementById("finalScore").innerText =
        score + " / " + questions.length;

        return;
    }

    loadQuestion();
}

function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    scoreElement.innerText = 0;

    document.getElementById("quizContainer").style.display = "grid";

    document.getElementById("resultScreen").style.display = "none";

    loadQuestion();
}

function updateProgress(){

    const progress =
    ((currentQuestion)/questions.length)*100;

    progressBar.style.width = progress + "%";
}

loadQuestion();

</script>

</body>
</html>
